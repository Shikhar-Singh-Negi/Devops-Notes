- name: Setup Nginx with Custom File
  hosts: servers
  become: yes

  tasks:
    - name: nginx
      apt:
        name: nginx
        state: present

    - name: copy the Custom HTML File
      copy:
        src: index.html
        dest: /var/www/html

    - name: Restart Nginx
      service: 
        name: nginx
        state: reloaded

    - name: Enable Nginx
      systemd_service:
        name: nginx
        enabled: true