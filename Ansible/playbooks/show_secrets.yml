- name: Show secrets
  hosts: server
  become: yes

  vars_files:   # isse jo bhi variables hai vo as it is utha lega
    - secrets.yml

  task:
    - name: Show password
      debug:
        msg: "My password is {{password}}"
      no_log: true  ## isse koi bhi output log me nhi dikhega
        
    - name: show api key
      debug:
        msg: "My api key is {{api_key}}"
      
# To run
# ansible-playbook -i ../hosts.ini show_secrets.yml